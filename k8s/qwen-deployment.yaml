---
apiVersion: v1
kind: Namespace
metadata:
  name: qwen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-coder
  namespace: qwen
spec:
  replicas: 2          # initial replica count — KEDA manages min/max
  selector:
    matchLabels:
      app: qwen-coder
  template:
    metadata:
      labels:
        app: qwen-coder
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Allow in-flight requests to drain before pod is killed
      terminationGracePeriodSeconds: 120

      # One replica per GPU node max
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: qwen-coder

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      nodeSelector:
        workload: llm

      # Validate GPU is accessible before starting vLLM
      initContainers:
        - name: cuda-init
          image: nvidia/cuda:12.4.1-base-ubuntu22.04
          command: ["nvidia-smi"]
          resources:
            limits:
              nvidia.com/gpu: "1"

      containers:
        - name: qwen-coder
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "Qwen/Qwen3.5-2B-Instruct""
            - "--served-model-name"
            - "qwen-coder"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--disable-log-requests"
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "8Gi"
              cpu: "4"
            requests:
              nvidia.com/gpu: "1"
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            # vLLM needs large /dev/shm for CUDA inter-process tensor sharing
            - name: shm
              mountPath: /dev/shm
            # Persist model weights to avoid re-downloading on pod restart
            - name: model-cache
              mountPath: /root/.cache/huggingface
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "30"]   # drain in-flight requests
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: "spawn"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi        # vLLM needs >> default 64Mi /dev/shm
        - name: model-cache
          emptyDir:
            sizeLimit: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-coder
  namespace: qwen
  labels:
    app: qwen-coder
spec:
  selector:
    app: qwen-coder
  ports:
    - port: 80
      targetPort: 8000
      name: http
