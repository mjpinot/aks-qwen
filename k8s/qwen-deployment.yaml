---
apiVersion: v1
kind: Namespace
metadata:
  name: qwen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen-coder
  namespace: qwen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen-coder
  template:
    metadata:
      labels:
        app: qwen-coder
    spec:
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        workload: llm
      containers:
        - name: qwen-coder
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "Qwen/Qwen2.5-Coder-3B-Instruct"
            - "--served-model-name"
            - "qwen-coder"
            - "--tensor-parallel-size"
            - "1"
            - "--max-model-len"
            - "8192"
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: "1"
              memory: "24Gi"
              cpu: "4"
            requests:
              nvidia.com/gpu: "1"
              memory: "16Gi"
              cpu: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
---
apiVersion: v1
kind: Service
metadata:
  name: qwen-coder
  namespace: qwen
spec:
  selector:
    app: qwen-coder
  ports:
    - port: 80
      targetPort: 8000
      name: http
